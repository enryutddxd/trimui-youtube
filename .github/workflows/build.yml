name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Compilar en Debian 11 (arm64)
        run: |
          mkdir -p out
          docker run --rm --platform linux/arm64 -v "$PWD":/work -w /work debian:bullseye bash -c "
            apt-get update &&
            apt-get install -y --no-install-recommends gcc libc6-dev libsdl2-dev &&
            gcc -O2 -o out/sdltest src/sdltest.c \$(sdl2-config --cflags --libs) &&
            ls -l out"
      - name: Armar carpeta Apps
        run: |
          mkdir -p dist/Apps/YouTube
          cp Apps/YouTube/* dist/Apps/YouTube/
          cp out/sdltest dist/Apps/YouTube/sdltest
      - uses: actions/upload-artifact@v4
        with:
          name: YouTube_Apps
          path: dist
